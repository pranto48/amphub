services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: remoteops
      POSTGRES_PASSWORD: remoteops
      POSTGRES_DB: remoteops
      BOOTSTRAP_DEFAULT_ADMIN: ${BOOTSTRAP_DEFAULT_ADMIN:-false}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteops -d remoteops"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=10M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - api_logs:/var/log/amphub
      - ./update-shared:/app/update-shared
    environment:
      DATABASE_URL: postgres://remoteops:remoteops@db:5432/remoteops
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      UPDATE_SHARED_SECRET: ${UPDATE_SHARED_SECRET:-change-me-in-production-update-secret}
      CORS_ORIGIN: "*"
      PORT: "4000"
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3355:80"

volumes:
  db_data:
  api_logs:
