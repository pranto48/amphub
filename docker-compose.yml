services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "7766:7766"
    volumes:
      - ./data:/app/data
      - ./update-shared:/app/update-shared
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      UPDATE_SHARED_SECRET: ${UPDATE_SHARED_SECRET:-change-me-in-production-update-secret}
      CORS_ORIGIN: "*"
      PORT: "3355"
      PORT_HTTP: "3355"
      PORT_SIGNAL: "7766"
      DATABASE_URL: "file:/app/data/amphub.db"
      AMPHUB_SSH_HOST: ${AMPHUB_SSH_HOST:-192.168.9.9}
      AMPHUB_SSH_USER: ${AMPHUB_SSH_USER:-it}
      AMPHUB_SSH_PASS: ${AMPHUB_SSH_PASS:-Interst0ff}
    expose:
      - "3355"
      - "7766"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_GIT_COMMIT_COUNT=${VITE_GIT_COMMIT_COUNT}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3355:80"
